<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="vplGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="100" cy="100" r="92" fill="#0c111a" stroke="url(#vplGrad)" stroke-width="6" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="76" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Spiral Shield Pattern -->
  <path d="M100 35 C135 35 165 65 165 100 C165 125 150 145 130 155 C120 140 120 120 130 100 C138 85 120 60 100 60 C80 60 62 85 70 100 C80 120 80 140 70 155 C50 145 35 125 35 100 C35 65 65 35 100 35 Z" fill="url(#vplGrad)" opacity="0.85"/>
  <circle cx="100" cy="100" r="18" fill="#ffffff" />
  <text x="100" y="106" font-family="'Montserrat', sans-serif" font-weight="900" font-size="16" fill="#0c111a" text-anchor="middle">FC</text>
  <text x="100" y="180" font-family="'Montserrat', sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle" letter-spacing="1">FVPL 2026</text>
</svg>

